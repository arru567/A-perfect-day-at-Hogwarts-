// w<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YOUR perfect Day at Hogwarts</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            font-family: Georgia, serif;

            min-height: 100vh;

            color: white;

            /* =========================
               ADD YOUR BACKGROUND IMAGE
               ========================= */

            background-image:
                
                url("https://i.ytimg.com/vi/Z-fLn7vXywc/hqdefault.jpg");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            overflow-x: hidden;
        }


        /* =========================
           PAGE
        ========================= */

        .page {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px;
        }


        /* =========================
           CARD
        ========================= */

        .card {

            width: 100%;

            max-width: 700px;

            background: #292344;

            border-radius: 25px;

            padding: 45px 40px;

            text-align: center;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.45);

            backdrop-filter: blur(8px);
        }


        /* =========================
           WELCOME
        ========================= */

        #welcome {
            display: block;
        }

        .emoji-big {

            font-size: 70px;

            margin-bottom: 15px;

            animation: float 3s ease-in-out infinite;
        }

        .eyebrow {

            color: #d4af37;

            text-transform: uppercase;

            letter-spacing: 3px;

            font-size: 13px;

            margin-bottom: 15px;
        }

        h1 {

            font-size: 48px;

            line-height: 1.1;

            margin-bottom: 20px;
        }

        .intro {

            font-size: 17px;

            line-height: 1.6;

            color:#FFFDD0;

            max-width: 550px;

            margin: auto;

            margin-bottom: 30px;
        }


        /* =========================
           BUTTON
        ========================= */

        .button {

            border: none;

            background: #d4af37;

            color: #241d2e;

            padding: 15px 32px;

            border-radius: 50px;

            font-size: 17px;

            font-family: Georgia, serif;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .button:hover {

            transform: translateY(-3px);

            background: #f0cc4d;
        }


        /* =========================
           QUIZ
        ========================= */

        #quiz {

            display: none;
        }

        .progress-text {

            color: #d4af37;

            font-size: 13px;

            letter-spacing: 2px;

            margin-bottom: 10px;
        }

        .progress-bar {

            width: 100%;

            height: 7px;

            background: #49415d;

            border-radius: 20px;

            overflow: hidden;

            margin-bottom: 30px;
        }

        .progress {

            height: 100%;

            width: 14%;

            background: #d4af37;

            border-radius: 20px;

            transition: width 0.4s ease;
        }


        /* =========================
           QUESTION
        ========================= */

        .question-emoji {

            font-size: 55px;

            margin-bottom: 15px;
        }

        h2 {

            font-size: 29px;

            line-height: 1.35;

            margin-bottom: 30px;
        }


        /* =========================
           ANSWERS
        ========================= */

        .answers {

            display: grid;

            gap: 13px;
        }

        .answer {

            width: 100%;

            padding: 17px 20px;

            border: 2px solid #4b435e;

            background: #332d52;

            border-radius: 15px;

            text-align: left;

            font-size: 16px;

            color: white;

            cursor: pointer;

            font-family: Georgia, serif;

            transition: 0.25s;
        }

        .answer:hover {

            border-color: #d4af37;

            background: #413960;

            transform: translateY(-2px);
        }


        /* =========================
           RESULT
        ========================= */

        #result {

            display: none;
        }

        .result-emoji {

            font-size: 75px;

            margin-bottom: 15px;
        }

        .result-title {

            font-size: 45px;

            margin-bottom: 15px;
        }

        .result-subtitle {

            color: #d4af37;

            font-size: 18px;

            margin-bottom: 25px;
        }

        .result-description {

            background: #332d52;

            border-radius: 18px;

            padding: 25px;

            line-height: 1.7;

            color: #ddd8e4;

            margin-bottom: 30px;
        }


        /* =========================
           ANIMATION
        ========================= */

        @keyframes float {

            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }

            100% {
                transform: translateY(0);
            }
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .page {
                padding: 15px;
            }

            .card {
                padding: 40px 22px;
            }

            h1 {
                font-size: 38px;
            }

            h2 {
                font-size: 24px;
            }

            .answer {
                font-size: 15px;
            }
        }

    </style>

</head>


<body>


<div class="page">

    <div class="card">


        <!-- =========================
             WELCOME
        ========================= -->

        <section id="welcome">

            <div class="emoji-big">
                🪄
            </div>

            <p class="eyebrow">
                The Hogwarts Sorting Ceremony
            </p>

            <h1>
                A Day at Hogwarts
            </h1>

            <p class="intro">
                Make your choices, follow your instincts,
                and discover which Hogwarts House
                matches you best.
            </p>

            <button class="button" onclick="startQuiz()">
                ✨ Begin
            </button>

        </section>



        <!-- =========================
             QUIZ
        ========================= -->

        <section id="quiz">

            <p class="progress-text" id="progressText">
                01 / 07
            </p>

            <div class="progress-bar">

                <div
                    class="progress"
                    id="progress">
                </div>

            </div>


            <div class="question-emoji" id="questionEmoji">
                🧹
            </div>


            <h2 id="question">
            </h2>


            <div
                class="answers"
                id="answers">
            </div>

        </section>



        <!-- =========================
             RESULT
        ========================= -->

        <section id="result">

            <div
                class="result-emoji"
                id="resultEmoji">
            </div>


            <p class="eyebrow">
                The Sorting Hat Has Spoken
            </p>


            <h1
                class="result-title"
                id="resultTitle">
            </h1>


            <p
                class="result-subtitle"
                id="resultSubtitle">
            </p>


            <div
                class="result-description"
                id="resultDescription">
            </div>


            <button
                class="button"
                onclick="restartQuiz()">

                ↻ Take It Again

            </button>

        </section>


    </div>

</div>



<script>


/* =================================
   QUESTIONS
================================= */

var questions = [

    {

        emoji: "🧹",

        question:
        "You wake up at Hogwarts. Where are you going first?",

        answers: [

            {
                text: "The Quidditch pitch",
                house: "gryffindor"
            },

            {
                text: "The library",
                house: "ravenclaw"
            },

            {
                text: "The Great Hall with my friends",
                house: "hufflepuff"
            },

            {
                text: "Explore somewhere secret",
                house: "slytherin"
            }

        ]

    },


    {

        emoji: "📚",

        question:
        "Which class sounds the most exciting?",

        answers: [

            {
                text: "Defence Against the Dark Arts",
                house: "gryffindor"
            },

            {
                text: "Charms",
                house: "ravenclaw"
            },

            {
                text: "Care of Magical Creatures",
                house: "hufflepuff"
            },

            {
                text: "Potions",
                house: "slytherin"
            }

        ]

    },


    {

        emoji: "🏰",

        question:
        "Your friends want to explore a mysterious part of the castle. What do you do?",

        answers: [

            {
                text: "I'm coming!",
                house: "gryffindor"
            },

            {
                text: "Let's find out what it is first.",
                house: "ravenclaw"
            },

            {
                text: "Only if everyone can come.",
                house: "hufflepuff"
            },

            {
                text: "I'll come up with a plan.",
                house: "slytherin"
            }

        ]

    },


    {

        emoji: "✨",

        question:
        "You discover a strange magical object. What do you do?",

        answers: [

            {
                text: "Try it immediately!",
                house: "gryffindor"
            },

            {
                text: "Research what it does.",
                house: "ravenclaw"
            },

            {
                text: "Show my friends first.",
                house: "hufflepuff"
            },

            {
                text: "Figure out how it could be useful.",
                house: "slytherin"
            }

        ]

    },


    {

        emoji: "⚡",

        question:
        "You have a free afternoon. What sounds best?",

        answers: [

            {
                text: "A Quidditch match",
                house: "gryffindor"
            },

            {
                text: "Reading something fascinating",
                house: "ravenclaw"
            },

            {
                text: "Hanging out with friends",
                house: "hufflepuff"
            },

            {
                text: "Exploring Hogwarts",
                house: "slytherin"
            }

        ]

    },


    {

        emoji: "🦉",

        question:
        "A friend is having a difficult time. What do you do?",

        answers: [

            {
                text: "Help them face the problem.",
                house: "gryffindor"
            },

            {
                text: "Think of a logical solution.",
                house: "ravenclaw"
            },

            {
                text: "Stay with them and support them.",
                house: "hufflepuff"
            },

            {
                text: "Find the smartest way to solve it.",
                house: "slytherin"
            }

        ]

    },


    {

        emoji: "🌙",

        question:
        "How would you end your day at Hogwarts?",

        answers: [

            {
                text: "Watching the sunset from the Astronomy Tower",
                house: "gryffindor"
            },

            {
                text: "Reading beside the fireplace",
                house: "ravenclaw"
            },

            {
                text: "Talking with friends in the common room",
                house: "hufflepuff"
            },

            {
                text: "Exploring the castle after hours",
                house: "slytherin"
            }

        ]

    }

];



/* =================================
   VARIABLES
================================= */

var currentQuestion = 0;

var houses = {

    gryffindor: 0,

    ravenclaw: 0,

    hufflepuff: 0,

    slytherin: 0

};



/* =================================
   START QUIZ
================================= */

function startQuiz() {

    document.getElementById("welcome").style.display =
        "none";

    document.getElementById("quiz").style.display =
        "block";

    currentQuestion = 0;

    houses = {

        gryffindor: 0,

        ravenclaw: 0,

        hufflepuff: 0,

        slytherin: 0

    };

    showQuestion();

}



/* =================================
   SHOW QUESTION
================================= */

function showQuestion() {

    var q = questions[currentQuestion];


    document.getElementById("progressText").textContent =

        String(currentQuestion + 1).padStart(2, "0")
        + " / 07";


    document.getElementById("progress").style.width =

        ((currentQuestion + 1) / 7 * 100) + "%";


    document.getElementById("questionEmoji").textContent =
        q.emoji;


    document.getElementById("question").textContent =
        q.question;


    var answers =
        document.getElementById("answers");


    answers.innerHTML = "";


    var letters = ["A", "B", "C", "D"];


    for (
        var i = 0;
        i < q.answers.length;
        i++
    ) {

        var button =
            document.createElement("button");


        button.className =
            "answer";


        button.innerHTML =
            "<strong>" +
            letters[i] +
            ".</strong> " +
            q.answers[i].text;


        button.onclick =
            (function(index) {

                return function() {

                    chooseAnswer(index);

                };

            })(i);


        answers.appendChild(button);

    }

}



/* =================================
   CHOOSE ANSWER
================================= */

function chooseAnswer(index) {

    var selected =
        questions[currentQuestion].answers[index];


    houses[selected.house]++;


    /*
       Automatically move to
       the next question.
    */

    if (currentQuestion < 6) {

        currentQuestion++;

        showQuestion();

    }

    else {

        findHouse();

    }

}



/* =================================
   FIND HOUSE
================================= */

function findHouse() {

    var winningHouse =
        "gryffindor";


    for (var house in houses) {

        if (
            houses[house] >
            houses[winningHouse]
        ) {

            winningHouse =
                house;

        }

    }


    var houseData = {

        gryffindor: {

            emoji: "🦁",

            name: "GRYFFINDOR",

            subtitle:
            "Brave, adventurous and ready for anything.",

            description:
            "You are brave, adventurous and ready to face challenges. You aren't afraid to step forward, take risks and make your own path."
        },


        ravenclaw: {

            emoji: "🦅",

            name: "RAVENCLAW",

            subtitle:
            "Curious, clever and always searching for more.",

            description:
            "You are curious, intelligent and love discovering new things. You enjoy learning, thinking deeply and looking at problems from different perspectives."
        },


        hufflepuff: {

            emoji: "🦡",

            name: "HUFFLEPUFF",

            subtitle:
            "Loyal, kind and always there for your people.",

            description:
            "You are loyal, kind and supportive. You value friendship and make sure the people around you know they aren't alone."
        },


        slytherin: {

            emoji: "🐍",

            name: "SLYTHERIN",

            subtitle:
            "Ambitious, clever and always thinking ahead.",

            description:
            "You are ambitious, clever and know how to achieve your goals. You think ahead, make plans and know how to turn an opportunity into something bigger."
        }

    };


    var result =
        houseData[winningHouse];


    document.getElementById("quiz").style.display =
        "none";


    document.getElementById("result").style.display =
        "block";


    document.getElementById("resultEmoji").textContent =
        result.emoji;


    document.getElementById("resultTitle").textContent =
        result.name;


    document.getElementById("resultSubtitle").textContent =
        result.subtitle;


    document.getElementById("resultDescription").textContent =
        result.description;

}



/* =================================
   RESTART
================================= */

function restartQuiz() {

    document.getElementById("result").style.display =
        "none";


    document.getElementById("welcome").style.display =
        "block";

}

</script>


</body>
</html>
